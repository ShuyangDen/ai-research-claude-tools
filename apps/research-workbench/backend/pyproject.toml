[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-workbench"
version = "0.3.1"
description = "Local-first research workbench backed by AI Research Tools and Codex."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "openai-codex>=0.147,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
research-workbench = "research_workbench.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
