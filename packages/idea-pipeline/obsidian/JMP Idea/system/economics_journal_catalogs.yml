  enabled_statuses: [verified_primary, verified_fallback, verified_version_abstract]
  route_order: [official_publisher, crossref, official_working_paper_version, repec_or_institutional_mirror, semantic_scholar, openalex]
  rule: "Connection or metadata alone is insufficient. Default scouting requires a dated route that exposed an actual recent abstract."
  discovery_caution: "Semantic Scholar/OpenAlex may bridge abstract access only after ISSN/DOI/canonical venue verification; they confer no ranking credit."

