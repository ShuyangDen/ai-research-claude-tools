  opportunity_rule: "Report crowding separately; a dense hotspot is not automatically a promising entry opportunity."
  field_multipliers: {labor: 1.20, education: 1.20, econometrics: 1.10, meta_analysis: 1.05, metascience: 1.05, general: 1.00}

abstract_access_policy:
