schema_version: 2
journal_catalog_registry: economics_journal_catalogs.yml

defaults:
  fast_moving_refresh_days: 90
  stable_refresh_days: 180
  general_journal_backfill_months: 24
  field_journal_backfill_months: 60
  scout_primary_route_budget_share: 0.80
  scout_candidate_primary_evidence_share: 0.70
  scout_open_discovery_max_share: 0.20
  scout_weighted_hotspot_attention_min: 1.60
  scout_abstract_access_required: true
  scout_topic_budget: {labor: 0.35, education: 0.35, econometrics: 0.15, meta_analysis: 0.15}

notes:
  - "Level 1 registry only: source identity, manual route, field tags, and cadence."
  - "Human-approved Search Protocol decides which field sources are active for a specific idea."
  - "Do not treat journal prestige as relevance. Record zero-result and unavailable routes in the gate Search Log."
  - "For idea-scout, prioritize official Top-5, labor/education field-journal, NBER, and IZA routes. Prestige affects retrieval effort and evidence reliability, not substantive relevance."
  - "OpenAlex is a discovery index, not a quality signal. Attribute quality to the verified canonical venue. arXiv is supplemental and cannot establish a hotspot by itself."
  - "Tianjin Ma Yinchu and SUFE economics journal tiers are transparent ranking priors. Preserve catalog source/date and never treat a tier as paper-level quality or novelty."
  - "A default journal route must pass a fresh abstract-access probe. Metadata-only connectivity does not qualify."
  - "Separate tier-weighted research attention from entry opportunity. High volume can indicate crowding and must not mechanically raise a candidate score."

