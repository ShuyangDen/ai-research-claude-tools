  metascience:
    include: [aer, qje, jpe, econometrica, restud, research_policy, aea_rct_registry, osf_registries]
  econometrics:
    include: [econometrica, journal_econometrics, quantitative_economics, journal_applied_econometrics, econometric_theory, econometrics_journal, obes]
  evidence_synthesis:
    include: [jel, jep, annual_review_economics, journal_economic_surveys]

scout_profiles:
  labor_education_default:
    primary: [aer, qje, jpe, econometrica, restud, jole, jhr, ilr_review, labour_economics, economics_of_education_review, education_finance_policy, nber_new_this_week, iza]
    secondary: [aej_applied, aej_policy, restat, journal_public_economics, journal_population_economics, industrial_relations, journal_econometrics, quantitative_economics, journal_applied_econometrics, econometric_theory, econometrics_journal, obes, jel, jep, annual_review_economics, journal_economic_surveys, cepr]
    discovery_only: [openalex_api, arxiv, ssrn_repec_author_pages]
    primary_route_budget_share: 0.80
    candidate_primary_evidence_share: 0.70
    open_discovery_max_share: 0.20
    hotspot_rule: "Open-discovery records may support a cluster but do not count toward the hotspot threshold unless the canonical venue is verified as primary or secondary economics evidence."
    abstract_access_rule: "Only journals marked enabled_by_default with a fresh verified abstract route in economics_journal_catalogs.yml enter the default pool."
    ranking_rule: "Use catalog-normalized tier weights for retrieval and tier-weighted attention; never infer novelty or paper quality from tier alone."
    opportunity_rule: "Report crowding separately from attention and require a candidate-level semantic, identification, and data review before calling a direction promising."
    topic_budget: {labor: 0.35, education: 0.35, econometrics: 0.15, meta_analysis: 0.15}
